{% extends 'blog/base.html' %}

{% block content %}
    <article class="post">
        <aside class="actions">
            {% if user.is_authenticated %}
                <a class="btn btn-default" href="{% url 'post_edit' pk=post.pk %}"><span class="glyphicon glyphicon-pencil"></span></a>
                <form method="post" action="{% url 'post_remove' pk=post.pk %}" style="display:inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-default"><span class="glyphicon glyphicon-remove"></span></button>
                </form>
            {% endif %}
        </aside>
        {% if post.published_date %}
            <time class="date">{{ post.published_date }}</time>
        {% else %}
            <form method="post" action="{% url 'post_publish' pk=post.pk %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-default">Опублікувати</button>
            </form>
        {% endif %}
        <h2>{{ post.title }}</h2>
        <p>{{ post.text|linebreaksbr }}</p>
    </article>
{% endblock %}
