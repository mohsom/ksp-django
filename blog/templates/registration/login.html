{% extends 'blog/base.html' %}

{% block content %}
    <h2>Вхід</h2>
    {% if form.errors %}
        <p>Невірне ім'я користувача або пароль.</p>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-default">Увійти</button>
    </form>
{% endblock %}
