<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Django Todo</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
        li { display: flex; gap: 8px; align-items: center; margin: 8px 0; }
        .done span { text-decoration: line-through; color: #888; }
        form.inline { display: inline; }
        .error { color: #c00; }
    </style>
</head>
<body>
    <h1>Django Todo</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.title }}
        <button type="submit">Додати</button>
        {% for e in form.title.errors %}<span class="error">{{ e }}</span>{% endfor %}
    </form>
    <ul>
        {% for task in tasks %}
        <li class="{% if task.done %}done{% endif %}">
            <form class="inline" method="post" action="{% url 'task_toggle' pk=task.pk %}">
                {% csrf_token %}
                <button type="submit">{% if task.done %}↩{% else %}✓{% endif %}</button>
            </form>
            <span>{{ task.title }}</span>
            <form class="inline" method="post" action="{% url 'task_delete' pk=task.pk %}">
                {% csrf_token %}
                <button type="submit">✕</button>
            </form>
        </li>
        {% empty %}
        <li>Задач поки немає.</li>
        {% endfor %}
    </ul>
</body>
</html>
